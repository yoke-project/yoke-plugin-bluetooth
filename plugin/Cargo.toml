[package]
name = "bluetooth"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bluetooth"
path = "src/lib.rs"

[[bin]]
name = "bluetooth"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
yoke-sdk = "=0.8.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

# A Plugin is a program of its own, never a member of a workspace around it.
[workspace]
